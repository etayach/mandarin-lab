["路","lù","ruta; carretera","Sustantivo","Lección 9","2-09-04"],

["饿","è","hambriento; tener hambre","Adjetivo","Lección 9","2-09-04"],
["天安门","Tiān'ānmén","Tian'anmen","Nombre propio","Lección 9","2-09-04"],
["苹果园","Píngguǒyuán","Pingguoyuan","Nombre propio","Lección 9","2-09-04"]
].map((w,i)=>({id:"book-"+i,hanzi:w[0],pinyin:w[1],meaning:w[2],pos:w[3],source:"book",lesson:w[4],audio:w[5],level:"",notes:"Transcrito de las fotografías compartidas por el usuario."}));

// Muestra inicial de vocabulario de nivel 3. La biblioteca admite importar la lista completa oficial.
const hskWords=[
["阿姨","āyí","tía","Sustantivo"],["矮","ǎi","bajo; de poca estatura","Adjetivo"],["爱人","àirén","cónyuge; pareja","Sustantivo"],["安静","ānjìng","tranquilo; silencioso","Adjetivo"],["安全","ānquán","seguro; seguridad","Adjetivo/Sustantivo"],["把","bǎ","clasificador; marcador de objeto","Partícula"],["搬","bān","mover; trasladar","Verbo"],["班级","bānjí","clase; grupo escolar","Sustantivo"],["搬家","bānjiā","mudarse de casa","Verbo"],["办","bàn","hacer; gestionar","Verbo"],["办法","bànfǎ","método; solución","Sustantivo"],["办公室","bàngōngshì","oficina","Sustantivo"],["半天","bàntiān","medio día; mucho rato","Expresión"],["帮助","bāngzhù","ayudar; ayuda","Verbo/Sustantivo"],["饱","bǎo","lleno; saciado","Adjetivo"],["报纸","bàozhǐ","periódico","Sustantivo"],["北","běi","norte","Sustantivo"],["北方","běifāng","el norte; región norte","Sustantivo"],["被","bèi","marcador de voz pasiva","Partícula"],["笔记","bǐjì","apuntes; notas","Sustantivo"]
].map((w,i)=>({id:"hsk3-"+i,hanzi:w[0],pinyin:w[1],meaning:w[2],pos:w[3],source:"hsk",lesson:"",level:"3",notes:"Muestra de trabajo; verificar contra el programa oficial antes de tratarla como lista completa."}));

let custom=JSON.parse(localStorage.getItem("ml2_custom")||"[]");
let progress=JSON.parse(localStorage.getItem("ml2_progress")||"{}");
let sessions=JSON.parse(localStorage.getItem("ml2_sessions")||"[]");
let prefs=JSON.parse(localStorage.getItem("ml2_prefs")||'{"dailyGoal":20,"voiceRate":0.82}');
let page="home",mode="hanzi",queue=[],idx=0,revealed=false,dictIdx=0,quiz=null;
let studySource="all",studyLesson="all";
let words=[...bookWords,...hskWords,...custom];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2200)}
function save(){localStorage.setItem("ml2_progress",JSON.stringify(progress));localStorage.setItem("ml2_sessions",JSON.stringify(sessions));localStorage.setItem("ml2_prefs",JSON.stringify(prefs))}
function p(w){return progress[w.id]||(progress[w.id]={reps:0,lapses:0,ease:2.5,interval:0,due:0,correct:0,wrong:0})}
function dueWords(list=words){let now=Date.now();return list.filter(w=>!p(w).due||p(w).due<=now)}
function dueCount(){return dueWords().length}
function accuracy(){let a=Object.values(progress),c=a.reduce((s,x)=>s+x.correct,0),n=a.reduce((s,x)=>s+x.correct+x.wrong,0);return n?Math.round(c/n*100):0}
function reviewed(){return Object.values(progress).reduce((s,x)=>s+x.correct+x.wrong,0)}
function mastered(){return words.filter(w=>p(w).reps>=3&&p(w).ease>=2.2).length}
function dayStreak(){let days=[...new Set(sessions.map(x=>new Date(x.date).toDateString()))];let n=0,d=new Date();while(days.includes(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n}
function record(w,ok){let x=p(w);x.reps++;x[ok?"correct":"wrong"]++;if(ok){x.ease=Math.max(1.3,x.ease+0.1);x.interval=x.interval===0?1:x.interval===1?3:Math.round(x.interval*x.ease);x.due=Date.now()+x.interval*86400000}else{x.lapses++;x.ease=Math.max(1.3,x.ease-0.2);x.interval=0;x.due=Date.now()+10*60000}sessions.push({date:Date.now(),id:w.id,ok});save();updateTop()}
function updateTop(){$("streak").textContent="🔥 "+dayStreak()+" días"}
function speak(t){
  if(!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)){
    toast("Este navegador no ofrece síntesis de voz. Prueba con Safari actualizado."); return;
  }
  try {
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang="zh-CN"; u.rate=Number(prefs.voiceRate)||.82; u.volume=1;
    u.onerror=e=>{
      console.warn("Mandarin Lab TTS:",e.error||e);
      toast("No se pudo reproducir el audio. Comprueba el modo silencio, el volumen y la salida de sonido del iPhone.");
    };
    speechSynthesis.speak(u);
  } catch(err) {
    console.error("Mandarin Lab TTS:",err);
    toast("No se pudo iniciar el audio. Comprueba el modo silencio y el volumen del dispositivo.");
  }
}
let activeRecognition = null;
let recognitionLog = [];
function recognitionSnapshot(extra={}){
  return {
    appVersion:"2.3",
    timestamp:new Date().toISOString(),
    userAgent:navigator.userAgent,
    secureContext:window.isSecureContext,
    apiAvailable:!!(window.SpeechRecognition||window.webkitSpeechRecognition),
    language:"zh-CN",
    ...extra
  };
}
function logRecognition(type,details={}){
  recognitionLog.push({time:new Date().toISOString(),event:type,...details});
  if(recognitionLog.length>30) recognitionLog=recognitionLog.slice(-30);
  console.info("[Mandarin Lab SpeechRecognition]",type,details);
}
function recognitionErrorMessage(code){
  const messages={
    "not-allowed":"Safari no autorizó el reconocimiento. Revisa Ajustes > Safari > Micrófono y los permisos del sitio.",
    "service-not-allowed":"El servicio de reconocimiento de voz no está permitido o disponible en este navegador.",
    "audio-capture":"Safari no pudo acceder a una entrada de audio. Comprueba el micrófono y que ninguna otra app lo esté usando.",
    "network":"El servicio de reconocimiento no pudo conectarse. Comprueba la conexión a internet e inténtalo de nuevo.",
    "no-speech":"No se detectó voz. Acerca el iPhone y vuelve a intentarlo en un lugar silencioso.",
    "aborted":"El reconocimiento fue cancelado antes de terminar.",
    "language-not-supported":"El navegador no admite el idioma de reconocimiento solicitado (zh-CN).",
    "bad-grammar":"El navegador rechazó la configuración de gramática."
  };
  return messages[code] || "Safari devolvió un error de reconocimiento no identificado. Copia el diagnóstico para revisarlo.";
}
function listen(onText,onError,onStatus=()=>{}){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!window.isSecureContext){
    const d=recognitionSnapshot({error:"insecure-context"});
    logRecognition("blocked",d); onError({code:"insecure-context",message:"El reconocimiento requiere una conexión HTTPS.",diagnostic:d}); return;
  }
  if(!SR){
    const d=recognitionSnapshot({error:"unsupported"});
    logRecognition("unsupported",d); onError({code:"unsupported",message:"Este Safari no ofrece SpeechRecognition. Puedes practicar y autoevaluarte sin transcripción.",diagnostic:d}); return;
  }
  if(activeRecognition){
    try{activeRecognition.stop();}catch(e){}
    activeRecognition=null;
  }
  const r=new SR();
  activeRecognition=r;
  let finished=false;
  r.lang="zh-CN";
  r.continuous=false;
  r.interimResults=false;
  r.maxAlternatives=3;
  const base=recognitionSnapshot({recognitionConstructor:SR.name||"webkitSpeechRecognition"});
  logRecognition("created",base);
  onStatus("Preparando el micrófono…");
  r.onstart=()=>{logRecognition("start");onStatus("Escuchando… habla ahora en mandarín.");};
  r.onaudiostart=()=>logRecognition("audiostart");
  r.onsoundstart=()=>logRecognition("soundstart");
  r.onspeechstart=()=>logRecognition("speechstart");
  r.onspeechend=()=>logRecognition("speechend");
  r.onsoundend=()=>logRecognition("soundend");
  r.onaudioend=()=>logRecognition("audioend");
  r.onresult=e=>{
    const results=e.results && e.results[e.resultIndex] ? e.results[e.resultIndex] : null;
    const text=results ? Array.from(results).map(x=>x.transcript).join(" / ") : "";
    logRecognition("result",{transcript:text,confidence:results&&results[0]?results[0].confidence:null});
    if(text) onText(text);
  };
  r.onnomatch=()=>{logRecognition("nomatch");onStatus("No se reconoció una frase. Inténtalo otra vez, hablando con claridad.");};
  r.onerror=e=>{
    const code=e.error||"unknown";
    const d=recognitionSnapshot({error:code,errorMessage:e.message||"",eventTimeStamp:e.timeStamp||null});
    logRecognition("error",d);
    finished=true;
    if(activeRecognition===r)activeRecognition=null;
    onError({code,message:recognitionErrorMessage(code),diagnostic:d});
  };
  r.onend=()=>{
    logRecognition("end");
    if(activeRecognition===r)activeRecognition=null;
    if(!finished) onStatus("La sesión terminó. Puedes volver a intentarlo.");
  };
  try{
    r.start();
    logRecognition("start-requested");
  }catch(err){
    const code=err&&err.name?err.name:"start-exception";
    const d=recognitionSnapshot({error:code,errorMessage:err&&err.message?err.message:String(err)});
    logRecognition("start-exception",d);
    if(activeRecognition===r)activeRecognition=null;

    <div class="lesson"><div><strong>v2.3 · Actual</strong><small>Diagnóstico detallado de SpeechRecognition en Safari, gestión del ciclo de vida, códigos de error específicos y herramienta para copiar registros.</small></div><span class="tag green">Actual</span></div>
    <div class="lesson"><div><strong>v2.2</strong><small>Versión visible, respaldo con metadatos y validación, ayuda contextual de audio para iPhone.</small></div></div>
    <div class="lesson"><div><strong>v2.1</strong><small>Filtros persistentes en Flashcards, relación coherente entre fuente y lección, contador filtrado y navegación dentro del conjunto seleccionado.</small></div></div>
    <div class="lesson"><div><strong>v2.0</strong><small>Primera versión de Mandarin Lab 2.0: flashcards, dictado, pronunciación, escritura, exámenes, biblioteca y estadísticas.</small></div></div>
  </div></div>
  <div class="panel"><h3>Diagnóstico de compatibilidad</h3><p class="muted">Mandarin Lab utiliza SpeechSynthesis para reproducir el modelo y SpeechRecognition para intentar reconocer tu voz. Safari puede ofrecer una API sin que el servicio de reconocimiento esté operativo. Si falla, entra en Pronunciación, pulsa «Repetir y reconocer» y usa «Copiar diagnóstico» para compartir el código de error y los eventos registrados.</p><p class="footnote">El diagnóstico no graba ni almacena tu voz. Solo registra eventos técnicos y, si Safari devuelve una transcripción, el texto reconocido se muestra en pantalla.</p></div>
  <div class="panel"><h3>Audio en iPhone</h3><p class="muted">La reproducción utiliza la síntesis de voz integrada en el navegador. Safari para iPhone puede gestionar la salida de audio de forma distinta según el modo silencio y la ruta de salida. Si falla, comprueba el modo silencio, el volumen y la salida de sonido. La aplicación no puede detectar directamente el interruptor físico.</p></div>
  <p class="footnote">Los datos se almacenan en este navegador. Borrar los datos del sitio puede eliminarlos; exporta respaldos periódicamente.</p>`;
  $("saveGoal").onclick=()=>{prefs.dailyGoal=Math.max(5,Math.min(120,Number($("goal").value)||20));save();toast("Objetivo guardado");settings()};
  $("rate").oninput=()=>$("rateValue").textContent=$("rate").value+"×";
  $("rate").onchange=()=>{prefs.voiceRate=Number($("rate").value);save()};
  $("testAudio").onclick=()=>speak("你好！我们一起学习中文。");
  $("export").onclick=()=>{
    const backup={app:"Mandarin Lab",appVersion:"2.3",backupSchema:1,exportedAt:new Date().toISOString(),progress,sessions,prefs,custom};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
    download(blob,"mandarin-lab-backup-"+new Date().toISOString().slice(0,10)+".json");
    toast("Respaldo exportado");
  };
  $("restore").onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        const valid=d&&typeof d==="object"&&!Array.isArray(d)&&d.progress&&typeof d.progress==="object"&&Array.isArray(d.sessions)&&d.prefs&&typeof d.prefs==="object"&&Array.isArray(d.custom);
        if(!valid)throw new Error("Formato de respaldo no reconocido");
        if(!confirm("La importación reemplazará el progreso, las preferencias y el vocabulario personal de este navegador. ¿Continuar?")){$("restore").value="";return;}
        progress=d.progress; sessions=d.sessions; prefs={...prefs,...d.prefs}; custom=d.custom.map(w=>({...w,source:"custom"}));
        localStorage.setItem("ml2_custom",JSON.stringify(custom));
        words=[...bookWords,...hskWords,...custom]; save(); updateTop();
        toast("Respaldo importado correctamente"); settings();
      }catch(err){toast("No se pudo importar: el archivo no es un respaldo válido de Mandarin Lab.");console.warn(err)}
      $("restore").value="";
    };
    r.onerror=()=>toast("No se pudo leer el archivo seleccionado.");
    r.readAsText(f,"UTF-8");
  };
}
function download(blob,name){let a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
 navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
home();
</script>
